<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gestionar Usuarios | Pawtastic</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="icon" href="../img/favicon.ico" type="image/png">
  <link rel="stylesheet" href="../css/style.css" />
</head>

<body class="bg-light d-flex flex-column min-vh-100">
  <!-- NAVBAR ADMIN -->
  <nav class="navbar navbar-expand-lg navbar-dark encabezado-azul">
    <div class="container position-relative">
      <a class="navbar-brand d-flex align-items-center" href="../index.html">
        <img src="../img/logo.png" alt="Logo Pawtastic" width="50" height="50" class="me-2 logo-navbar">
        <span class="text-warning fw-bold">Pawtastic</span>
      </a>
      <div class="position-absolute top-50 start-50 translate-middle">
        <span class="navbar-text h4 m-0 text-dark fw-bold">GESTIÓN DE USUARIOS 👥</span>
      </div>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="perfil-admin.html">Volver al Panel</a></li>
          <li class="nav-item">
            <a href="#" class="nav-link text-danger fw-bold" data-bs-toggle="modal" data-bs-target="#modalCerrarSesion">
              <i class="bi bi-box-arrow-right me-1"></i>Salir
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="container py-5 flex-grow-1">
    <div class="card shadow-lg">
      <div class="card-header bg-white py-3">
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input type="text" class="form-control" id="filtro-usuarios" placeholder="Buscar por nombre, apellido o email...">
        </div>
      </div>
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Email</th>
                <th>Tipo</th>
                <th>Estado</th>
                <th class="text-center">Acciones</th>
              </tr>
            </thead>
            <tbody id="tabla-usuarios-body">
              <!-- Las filas de usuarios se insertarán aquí dinámicamente -->
              <tr>
                <td colspan="7" class="text-center">
                  <div class="spinner-border text-warning" role="status">
                    <span class="visually-hidden">Cargando...</span>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- MODAL ASIGNAR ONG -->
  <div class="modal fade" id="modalAsignarOng" tabindex="-1" aria-labelledby="modalAsignarOngLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form id="formAsignarOng">
          <div class="modal-header">
            <h5 class="modal-title" id="modalAsignarOngLabel">Asignar ONG a Usuario</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="usuarioIdParaAsignar">
            <p>Usuario: <strong id="nombreUsuarioParaAsignar"></strong></p>
            <div class="mb-3">
              <label for="selectOng" class="form-label">Seleccionar ONG</label>
              <select class="form-select" id="selectOng" required>
                <!-- Opciones de ONG se cargarán aquí -->
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">Guardar Asignación</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- MODAL SALIR (reutilizado) -->
  <div class="modal fade" id="modalCerrarSesion" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-warning-subtle">
          <h5 class="modal-title">¿Cerrar sesión?</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">¿Estás seguro de que quieres salir?</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button id="confirmarSalir" class="btn btn-danger">Sí, salir</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Contenedor de Toasts -->
  <div class="toast-container position-fixed top-0 start-50 translate-middle-x p-3"></div>

  <!-- FOOTER -->
  <footer class="bg-footer text-dark pt-4 pb-3 mt-5">
    <div class="container text-center">
      <hr class="border-dark">
      <small>&copy; 2025 Pawtastic. Todos los derechos reservados.</small>
    </div>
  </footer>

  <script>
    document.getElementById("confirmarSalir").addEventListener("click", () => {
      localStorage.removeItem("token");
      localStorage.removeItem("tipo");
      window.location.href = "/index.html";
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/gestionar-usuarios.js"></script>
</body>

</html>
