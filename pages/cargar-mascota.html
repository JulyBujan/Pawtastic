<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cargar Mascota | Pawtastic</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="icon" href="../img/favicon.ico" type="image/png">
  <link rel="stylesheet" href="../css/style.css" />
</head>

<body>
  <!-- NAVBAR ONG -->
  <nav class="navbar navbar-expand-lg navbar-dark encabezado-azul">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="../index.html">
        <img src="../img/logo.png" alt="Logo Pawtastic" width="50" height="50" class="me-2 logo-navbar">
        <span class="text-warning fw-bold">Pawtastic</span>
      </a>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="./perfil-ong.html">Volver al Perfil</a></li>
          <li class="nav-item"><a class="nav-link" href="./mis-mascotas.html">Mis Mascotas</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="container py-5">
    <div class="card mx-auto shadow-lg" style="max-width: 600px;">
      <div class="card-body">
        <h2 class="card-title text-center text-warning mb-4">Cargar Nueva Mascota</h2>
        <form id="formMascota" enctype="multipart/form-data">
          <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" name="nombre" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Tipo</label>
            <select name="tipo" class="form-select" required>
              <option value="">Seleccionar</option>
              <option value="perro">Perro 🐶</option>
              <option value="gato">Gato 🐱</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Edad (en años)</label>
            <input type="number" name="edad" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Sexo</label>
            <select name="sexo" class="form-select" required>
              <option value="">Seleccionar</option>
              <option value="Macho">Macho</option>
              <option value="Hembra">Hembra</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Tamaño</label>
            <select name="tamaño" class="form-select" required>
              <option value="">Seleccionar</option>
              <option value="Pequeño">Pequeño</option>
              <option value="Mediano">Mediano</option>
              <option value="Grande">Grande</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Descripción</label>
            <textarea name="descripcion" class="form-control" required></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label">Foto</label>
            <input type="file" name="imagen" accept="image/*" class="form-control">
          </div>

          <hr>
          <h5 class="text-center text-warning mb-3">Datos adicionales</h5>

          <div class="row">
            <div class="col-md-4 mb-3">
              <label class="form-label">Vacunado</label>
              <select name="vacunado" class="form-select" required>
                <option value="si">Sí</option>
                <option value="no">No</option>
              </select>
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label">Esterilizado</label>
              <select name="esterilizado" class="form-select" required>
                <option value="si">Sí</option>
                <option value="no">No</option>
              </select>
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label">Chip</label>
              <select name="chip" class="form-select" required>
                <option value="si">Sí</option>
                <option value="no">No</option>
              </select>
            </div>
          </div>

          <hr>
          <h5 class="text-center text-warning mb-3">Personalidad de la mascota</h5>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Nivel de energía</label>
              <select name="energia" class="form-select" required>
                <option value="0" disabled>Seleccionar...</option>
                <option value="1">Bajo</option>
                <option value="2">Medio</option>
                <option value="3">Alto</option>
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Sociabilidad</label>
              <select name="sociabilidad" class="form-select" required>
                <option value="0" disabled>Seleccionar...</option>
                <option value="1">Tímido</option>
                <option value="2">Amigable</option>
                <option value="3">Muy sociable</option>
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Presencia</label>
              <select name="presencia" class="form-select" required>
                <option value="0" disabled>Seleccionar...</option>
                <option value="1">Independiente</option>
                <option value="2">Regular</option>
                <option value="3">Dependiente</option>
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Estilo de vida</label>
              <select name="estilov" class="form-select" required>
                <option value="0" disabled>Seleccionar...</option>
                <option value="1">Interior</option>
                <option value="2">Mixto</option>
                <option value="3">Exterior</option>
              </select>
            </div>
          </div>

          <div class="d-grid mt-4">
            <button type="submit" class="btn btn-dark">Guardar Mascota</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Contenedor de Toasts -->
  <div class="toast-container position-fixed top-0 start-50 translate-middle-x p-3">
    <!-- Los toasts se insertarán aquí dinámicamente -->
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/cargar-mascota.js"></script>
</body>

</html>
