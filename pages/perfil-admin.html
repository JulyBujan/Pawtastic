<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Perfil Administrador | Pawtastic</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="icon" href="../img/favicon.ico" type="image/png">
  <link rel="stylesheet" href="../css/style.css" />
</head>

<body class="bg-light d-flex flex-column min-vh-100">
  <!-- NAVBAR ADMIN -->
  <nav class="navbar navbar-expand-lg navbar-dark encabezado-azul">
    <div class="container position-relative">
      <a class="navbar-brand d-flex align-items-center" href="../index.html">
        <img src="../img/logo.png" alt="Logo Pawtastic" width="50" height="50" class="me-2 logo-navbar">
        <span class="text-warning fw-bold">Pawtastic</span>
      </a>

      <div class="position-absolute top-50 start-50 translate-middle">
        <span class="navbar-text h4 m-0 text-dark fw-bold">
          PANEL ADMIN ⚙️
        </span>
      </div>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
          <li class="nav-item">
            <a href="#" class="nav-link text-danger fw-bold" data-bs-toggle="modal" data-bs-target="#modalCerrarSesion">
              <i class="bi bi-box-arrow-right me-1"></i>Salir
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- CONTENIDO PRINCIPAL ADMIN -->
  <main class="container py-5 flex-grow-1">
    <div class="card mx-auto shadow-lg text-center" style="max-width: 600px;">
      <div class="card-body">
        <h2 id="bienvenidaAdmin" class="mb-4 text-warning">¡Bienvenido, Admin!</h2>
        <p class="fs-5">Usuario: <span id="nombreAdmin" class="text-dark fw-bold">Cargando...</span></p>

        <div class="d-grid gap-3 mt-4">
          <a href="gestionar-usuarios.html" class="btn btn-dark"><i class="bi bi-people-fill me-2"></i>Gestionar Usuarios</a>
          <a href="gestionar-ongs.html" class="btn btn-dark"><i class="bi bi-building me-2"></i>Gestionar ONGs</a>
          <a href="gestionar-mascotas-borradas.html" class="btn btn-outline-dark"><i class="bi bi-trash me-2"></i>Gestionar Mascotas Borradas</a>
          <a href="gestionar-vacunas.html" class="btn btn-outline-dark"><i class="bi bi-eyedropper me-2"></i>Gestionar Vacunas</a>
        </div>

      </div>
    </div>
  </main>

  <!-- MODAL SALIR -->
  <div class="modal fade" id="modalCerrarSesion" tabindex="-1" aria-labelledby="modalCerrarSesionLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-warning-subtle">
          <h5 class="modal-title" id="modalCerrarSesionLabel">¿Cerrar sesión?</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          ¿Estás seguro de que quieres salir del sitio?
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button id="confirmarSalir" class="btn btn-danger">Sí, salir</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Contenedor de Toasts -->
  <div class="toast-container position-fixed top-0 start-50 translate-middle-x p-3">
    <!-- Los toasts se insertarán aquí dinámicamente -->
  </div>

  <!-- FOOTER -->
  <footer class="bg-footer text-dark pt-4 pb-3 mt-5">
    <div class="container text-center">
      <hr class="border-dark">
      <small>&copy; 2025 Pawtastic. Todos los derechos reservados.</small>
    </div>
  </footer>

  <script>
    document.getElementById("confirmarSalir").addEventListener("click", function () {
      localStorage.removeItem("token");
      localStorage.removeItem("tipo");
      window.location.href = "/index.html";
    });
  </script>
  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/perfil-admin.js"></script>

</body>

</html>
