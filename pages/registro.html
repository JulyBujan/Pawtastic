<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="keywords"
    content="perros en adopción, gatos en adopción, refugio de animales, Almas Peludas, mascotas rescatadas, hogar para animales, animales sin hogar, adopción responsable, cuidar mascotas, encontrar mascota, adoptar animales, gatos callejeros, perros callejeros, voluntariado animal, protección animal, amor por los animales" />

  <meta name="author" content="Wunsche Julieta, Sergio Bujan, Georgina Contreras, Jonathan Revelino" />
  <title>Registrarse | Pawtastic</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="icon" href="../img/favicon.ico" type="image/x-icon" />
</head>

<body class="form-theme login-body d-flex flex-column min-vh-100">
  <nav class="navbar navbar-expand-lg navbar-dark login-nav">
    <div class="container">
      <button class="navbar-toggler me-2" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <a class="navbar-brand text-warning fw-bold me-3" href="../index.html">
        <img src="../img/logo.png" alt="Logo Pawtastic" width="40" height="40" class="d-inline-block d-lg-none">
        <span class="d-none d-lg-inline">Pawtastic</span>
      </a>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav align-items-lg-center ms-auto">
          <li class="nav-item">
            <a class="btn btn-custom-nav btn-custom-nav-light me-lg-2" href="../index.html">Inicio</a>
          </li>
          <li class="nav-item">
            <a class="btn btn-custom-nav btn-custom-nav-light" href="./login.html">Ingresar</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Formulario de Registro -->
  <section class="login-section flex-grow-1">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card login-panel login-card">
            <div class="card-body p-4">
              <div class="login-head text-center mb-4">
                <span class="login-kicker">Sumate a Pawtastic</span>
                <h2 class="text-warning">Crear cuenta</h2>
              </div>
              <form id="formRegistro" novalidate autocomplete="off">
                <div class="mb-3">
                  <label for="nombre" class="form-label">Nombre</label>
                  <input type="text" class="form-control" id="nombre" autocomplete="off" required />
                </div>
                <div class="mb-3">
                  <label for="apellido" class="form-label">Apellido</label>
                  <input type="text" class="form-control" id="apellido" autocomplete="off" required />
                </div>
                <div class="mb-3">
                  <label for="email" class="form-label">Correo electrónico</label>
                  <input type="email" class="form-control" id="email" autocomplete="off" required />
                </div>
                <div class="mb-3">
                  <label for="password" class="form-label">Contraseña</label>
                  <input type="password" class="form-control" id="password" autocomplete="new-password" required />
                </div>
                <div class="mb-3">
                  <label for="confirm-password" class="form-label">Reconfirmar contraseña</label>
                  <input type="password" class="form-control" id="confirm-password" autocomplete="new-password" required>
                  <div class="invalid-feedback">Las contraseñas no coinciden.</div>
                </div>
                <div class="d-grid">
                  <button type="submit" class="btn btn-dark">
                    Registrarse
                  </button>
                </div>
                <div class="mt-3 text-center">
                  <small>¿Ya tenés cuenta?
                    <a href="../pages/login.html">Iniciar sesión</a></small>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
  <!-- FOOTER -->
  <footer class="login-footer">
    <div class="container text-center">
      <a href="./terminosYcondiciones.html">Términos y condiciones</a>
      <span class="footer-divider">|</span>
      <a href="./politicaDeCookies.html">Política de cookies</a>
    </div>
  </footer>
  <!-- Contenedor de Toasts -->
  <div class="toast-container position-fixed top-0 start-50 translate-middle-x p-3">
    <!-- Los toasts se insertarán aquí dinámicamente -->
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/registro.js"></script>
</body>

</html>
