<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="pagina de adopcion de mascotas">
  <meta name="keywords"
    content="perros en adopción, gatos en adopción, refugio de animales, Almas Peludas, mascotas rescatadas, hogar para animales, animales sin hogar, adopción responsable, cuidar mascotas, encontrar mascota, adoptar animales, gatos callejeros, perros callejeros, voluntariado animal, protección animal, amor por los animales">
  <meta name="author" content="Wunsche Julieta, Sergio Bujan, Georgina Contreras, Jonathan Revelino">
  <title>Ingresar | Pawtastic</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="icon" href="../img/favicon.ico" type="image/png">
  <link rel="stylesheet" href="../css/style.css">
</head>

<body class="login-body d-flex flex-column min-vh-100">
  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark login-nav">
    <div class="container">
      <button class="navbar-toggler me-2" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <a class="navbar-brand text-warning fw-bold me-3" href="../index.html">
        <img src="../img/logo.png" alt="Logo Pawtastic" width="40" height="40" class="d-inline-block d-lg-none">
        <span class="d-none d-lg-inline">Pawtastic</span>
      </a>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav align-items-lg-center ms-auto">
          <li class="nav-item">
            <a class="btn btn-custom-nav btn-custom-nav-light" href="../index.html">Inicio</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- FORMULARIO LOGIN -->
  <section class="login-section flex-grow-1">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card login-panel login-card">
            <div class="card-body p-4">
              <form id="formLogin" novalidate>
                <div class="login-head text-center mb-4">
                  <span class="login-kicker">Bienvenido</span>
                  <h2 class="text-warning">Iniciar sesión</h2>
                </div>

                <div class="mb-3">
                  <label for="email" class="form-label">Correo electrónico</label>
                  <input type="email" class="form-control" id="email" name="email" placeholder="ejemplo@mail.com"
                    required>
                </div>

                <div class="mb-3">
                  <label for="password" class="form-label">Contraseña</label>
                  <input type="password" class="form-control" id="password" name="password" placeholder="••••••••"
                    required>
                </div>

                <div class="d-grid">
                  <button type="submit" class="btn btn-dark">Ingresar</button>
                </div>

                <div class="mt-3 text-center">
                  <small>¿No tenés cuenta? <a href="../pages/registro.html">Registrate acá</a></small><br>
                  <small><a href="#" data-bs-toggle="modal" data-bs-target="#modalRecuperar">¿Olvidaste tu
                      contraseña?</a></small>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- MODAL RECUPERAR CONTRASEÑA -->
  <div class="modal fade" id="modalRecuperar" tabindex="-1" aria-labelledby="modalRecuperarLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-warning-subtle">
          <h5 class="modal-title" id="modalRecuperarLabel">Recuperar contraseña</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <form id="formRecuperar" novalidate>
            <div class="mb-3">
              <label for="emailRecuperar" class="form-label">Ingresá tu correo electrónico</label>
              <input type="email" class="form-control" id="emailRecuperar" required>
              <div class="invalid-feedback">Por favor ingresá un correo válido.</div>
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-dark">Enviar instrucciones</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="login-footer">
    <div class="container text-center">
      <a href="./terminosYcondiciones.html">Términos</a>
      <span class="footer-divider">|</span>
      <a href="./politicaDeCookies.html">Cookies</a>
    </div>
  </footer>
  <!-- Contenedor de Toasts -->
  <div class="toast-container position-fixed top-0 start-50 translate-middle-x p-3">
    <!-- Los toasts se insertarán aquí dinámicamente -->
  </div>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/login.js"></script>

</body>

</html>
