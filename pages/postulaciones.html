<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Postulaciones | Pawtastic</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="icon" href="../img/favicon.ico" type="image/png" />
</head>

<body class="bg-light d-flex flex-column min-vh-100">
  <!-- ENCABEZADO -->
  <header class="encabezado-azul shadow-sm py-3 sticky-top">
    <div class="container d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center">
        <img src="../img/logo.png" alt="Logo Pawtastic" width="50" class="me-2 rounded-circle" />
        <h1 class="h4 text-warning m-0">Pawtastic</h1>
      </div>
      <div id="nav-links" class="d-flex gap-2 align-items-center">
        <!-- Los enlaces se cargarán dinámicamente aquí -->
        <a href="#" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#modalCerrarSesion" title="Salir">
          <i class="bi bi-box-arrow-right me-1"></i>Salir
        </a>
      </div>
    </div>
  </header>

  <!-- LISTADO DE POSTULACIONES -->
  <main class="container py-5 flex-grow-1">
    <h2 class="text-center text-warning mb-4 fw-bold">Mis Postulaciones</h2>
    <div class="row">
      <div class="col-12" id="postulaciones-container">
        <!-- La tabla de postulaciones se cargará aquí -->
      </div>
    </div>
  </main>

  <!-- MODAL DE CONFIRMACIÓN DE CIERRE DE SESIÓN -->
  <div class="modal fade" id="modalCerrarSesion" tabindex="-1" aria-labelledby="modalCerrarSesionLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-warning-subtle">
          <h5 class="modal-title" id="modalCerrarSesionLabel">¿Cerrar sesión?</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          ¿Estás seguro de que quieres salir del sitio?
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button id="confirmarSalir" class="btn btn-danger">Sí, salir</button>
        </div>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="bg-footer text-dark pt-4 pb-3 mt-5">
    <div class="container text-center text-md-start">
      <div class="row">
        <div class="col-md-4 mb-3 text-center">
          <h5 class="fw-bold mt-2">Pawtastic</h5>
          <p class="small">Conectamos corazones con patas. Gracias por elegir adoptar.</p>
          <a href="/index.html">
            <img src="/img/logo.png" alt="Logo Pawtastic" style="max-width: 100px; border-radius: 40%;">
          </a>
        </div>
        <div class="col-md-4 mb-3 d-flex flex-column align-items-center">
          <h5 class="fw-bold text-center">Navegación</h5>
          <ul class="list-unstyled text-center">
            <li><a href="/index.html" class="text-dark text-decoration-none">Inicio</a></li>
            <li><a href="/pages/login.html" class="text-dark text-decoration-none">Ingresar</a></li>
            <li><a href="/pages/nosotros.html" class="text-dark text-decoration-none">Nosotros</a></li>
          </ul>
        </div>
        <div class="col-md-4 mb-3 fs-5 text-center text-md-start">
          <h5 class="fw-bold">Seguinos</h5>
          <a href="/pages/error404.html" class="text-dark me-3"><i class="bi bi-facebook" style="font-size: 2.5rem;"></i></a>
          <a href="/pages/error404.html" class="text-dark me-3"><i class="bi bi-instagram" style="font-size: 2.5rem;"></i></a>
          <a href="/pages/error404.html" class="text-dark"><i class="bi bi-x-circle-fill" style="font-size: 2.5rem;"></i></a>
        </div>
      </div>
      <hr class="border-dark">
      <div class="text-center">
        <small>&copy; 2025 Pawtastic. Todos los derechos reservados.</small>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/postulaciones.js"></script>
  <script>
    // Lógica para el botón de salir y el enlace de perfil dinámico
    document.addEventListener('DOMContentLoaded', () => {
      const tipoUsuario = localStorage.getItem('tipo');
      const navLinksContainer = document.getElementById('nav-links');
      const salirButton = navLinksContainer.querySelector('.btn-danger');

      let linksHTML = '';

      if (tipoUsuario === 'ong') {
        linksHTML = `
          <a href="perfil-ong.html" class="btn btn-outline-dark">Inicio</a>
          <a href="mis-mascotas.html" class="btn btn-outline-dark">Mis Mascotas</a>
          <a href="ver-reportes.html" class="btn btn-outline-dark">Estadisticas</a>
        `;
      } else {
        linksHTML = `
          <a href="catalogo.html" class="btn btn-outline-dark">Catálogo</a>
          <a href="usuario.html" class="btn btn-outline-dark">Mi Perfil</a>
        `;
      }
      salirButton.insertAdjacentHTML('beforebegin', linksHTML);

      document.getElementById("confirmarSalir").addEventListener("click", function () {
        localStorage.removeItem("token");
        localStorage.removeItem("tipo");
        window.location.href = "/index.html";
      });
    });
  </script>
</body>

</html>
