<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Detalle Mascota | Pawtastic</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="icon" href="../img/favicon.ico" type="image/png" />
</head>

<body class="bg-light">
  <!-- ENCABEZADO -->
  <header class="encabezado-azul shadow-sm py-3 sticky-top">
    <div class="container d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center">
        <img src="../img/logo.png" alt="Logo Pawtastic" width="50" class="me-2 rounded-circle" />
        <h1 class="h4 text-warning m-0">Pawtastic</h1>
      </div>
      <a href="./catalogo.html" class="btn btn-outline-dark">← Volver al catálogo</a>
    </div>
  </header>

  <!-- DETALLE DE MASCOTA -->
  <main class="container py-5">
    <div class="row">
      <!-- IMAGEN -->
      <div class="col-md-6">
        <img src="" alt="" class="img-fluid rounded shadow" id="mascota-imagen" />
      </div>

      <!-- INFORMACIÓN -->
      <div class="col-md-6">
        <h2 class="text-warning" id="mascota-nombre"></h2>
        <p class="text-muted fs-5" id="mascota-descripcion"></p>
        <ul class="list-group list-group-flush mb-4">
          <li class="list-group-item"><strong>Edad:</strong> <span id="mascota-edad"></span></li>
          <li class="list-group-item"><strong>Especie:</strong> <span id="mascota-especie"></span></li>
          <li class="list-group-item"><strong>Tamaño:</strong> <span id="mascota-tamano"></span></li>
          <li class="list-group-item"><strong>Vacunas:</strong> <span id="mascota-vacunas"></span></li>
          <li class="list-group-item"><strong>Esterilizado:</strong> <span id="mascota-esterilizado"></span></li>
          <li class="list-group-item"><strong>Chip:</strong> <span id="mascota-chip"></span></li>
          <li class="list-group-item"><strong>Energía:</strong> <span id="mascota-energia"></span></li>
          <li class="list-group-item"><strong>Sociabilidad:</strong> <span id="mascota-sociabilidad"></span></li>
          <li class="list-group-item"><strong>Presencia:</strong> <span id="mascota-presencia"></span></li>
          <li class="list-group-item"><strong>Estilo de vida:</strong> <span id="mascota-estilo-vida"></span></li>
          <li class="list-group-item"><strong>Estado:</strong> <span id="mascota-estado"></span></li>
          <li class="list-group-item"><strong>ONG responsable:</strong> <span id="mascota-ong"></span></li>
        </ul>
        <div class="d-grid gap-2">
          <a href="#" class="btn btn-dark" id="postular-btn">Postularme para adoptar</a>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/detalle.js"></script>
</body>

</html>
