<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Detalle Mascota | Pawtastic</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="icon" href="../img/favicon.ico" type="image/png" />
</head>

<body class="detalle-body">
  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark nav-app">
    <div class="container">
      <button class="navbar-toggler me-2" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <a class="navbar-brand d-flex align-items-center" href="../index.html">
        <img src="../img/logo.png" alt="Logo Pawtastic" width="40" height="40" class="me-2 rounded-circle d-lg-none" />
        <span class="text-warning fw-bold d-none d-lg-inline">Pawtastic</span>
      </a>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item">
            <a href="./catalogo.html" class="btn btn-custom-nav" id="detalleBackLink">
              <i class="bi bi-arrow-left"></i> Volver al catálogo
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- DETALLE DE MASCOTA -->
  <main class="container py-5">
    <div class="detail-shell">
      <div class="row g-4">
      <!-- IMAGEN -->
      <div class="col-lg-6">
        <div class="card detail-card border-0 shadow-sm">
          <div class="detail-gallery" id="detailGallery">
            <div class="detail-main-img">
              <img src="" alt="" class="img-fluid" id="mascota-imagen" />
            </div>
            <div class="detail-thumbs" id="mascota-thumbs"></div>
          </div>
        </div>

        <!-- MAPA DE DISTANCIA -->
        <div id="mapa-section" class="card detail-card border-0 shadow-sm mt-4 d-none">
          <div class="card-body">
            <button class="btn detail-map-toggle w-100 d-flex align-items-center justify-content-between"
              type="button" data-bs-toggle="collapse" data-bs-target="#mapa-collapse" aria-expanded="false"
              aria-controls="mapa-collapse">
              <span><i class="bi bi-geo-alt-fill me-2"></i>Ubicación de la ONG</span>
              <i class="bi bi-chevron-down"></i>
            </button>
            <div class="collapse mt-3" id="mapa-collapse">
              <div id="map" class="detail-map"></div>
              <p id="distancia-info" class="text-center mt-2 fw-semibold small text-muted"></p>
            </div>
          </div>
        </div>
      </div>

      <!-- INFORMACIÓN -->
      <div class="col-lg-6">
        <div class="card detail-card border-0 shadow-sm">
          <div class="card-body">
            <div class="detail-header">
              <div class="detail-title-block">
                <span class="detail-badge" id="mascota-estado"></span>
                <h2 class="detail-title">
                  <span id="mascota-nombre"></span>
                  <i class="bi bi-paw-fill detail-title-icon" aria-hidden="true"></i>
                </h2>
                <div class="detail-ong">ONG: <span id="mascota-ong"></span></div>
              </div>
              <div class="detail-chip-group">
                <span class="detail-chip" id="chip-edad"></span>
                <span class="detail-chip" id="chip-especie"></span>
                <span class="detail-chip" id="chip-tamano"></span>
                <span class="detail-chip" id="chip-energia"></span>
              </div>
            </div>

            <p class="text-muted fs-6 mt-3 detail-description" id="mascota-descripcion"></p>
            <div class="detail-actions mt-3 d-none" id="postular-section">
              <button type="button" class="detail-cta" id="postular-btn">
                <i class="bi bi-check2-circle me-2"></i>Postularme
              </button>
            </div>

            <div class="detail-sections mt-4">
              <div class="detail-section">
                <div class="detail-section-title detail-title-quick"><i class="bi bi-stars me-2"></i>Ficha rápida</div>
                <div class="detail-list">
                  <div class="detail-item"><span>Raza</span><strong id="mascota-raza"></strong></div>
                  <div class="detail-item"><span>Color</span><strong id="mascota-color"></strong></div>
                </div>
              </div>
              <div class="detail-section">
                <div class="detail-section-title detail-title-health"><i class="bi bi-shield-check me-2"></i>Salud</div>
                <div class="detail-list">
                  <div class="detail-item"><span>Vacunas</span><strong id="mascota-vacunas"></strong></div>
                  <div class="detail-item"><span>Esterilizado</span><strong id="mascota-esterilizado"></strong></div>
                  <div class="detail-item"><span>Chip</span><strong id="mascota-chip"></strong></div>
                </div>
              </div>
              <div class="detail-section">
                <div class="detail-section-title detail-title-social"><i class="bi bi-emoji-smile me-2"></i>Convivencia</div>
                <div class="detail-list">
                  <div class="detail-item"><span>Sociabilidad</span><strong id="mascota-sociabilidad"></strong></div>
                  <div class="detail-item"><span>Presencia</span><strong id="mascota-presencia"></strong></div>
                  <div class="detail-item"><span>Estilo de vida</span><strong id="mascota-estilo-vida"></strong></div>
                </div>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
    </div>
  </main>

  <footer class="mini-footer mt-4">
    <div class="container text-center">
      <a href="./terminosYcondiciones.html" class="text-decoration-none">Términos y condiciones</a>
      <span class="mx-2">|</span>
      <a href="./politicaDeCookies.html" class="text-decoration-none">Política de cookies</a>
    </div>
  </footer>

  <!-- Contenedor de Toasts -->
  <div class="toast-container position-fixed top-0 start-50 translate-middle-x p-3">
    <!-- Los toasts se insertarán aquí dinámicamente -->
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="../js/toast.js"></script>
  <script src="../js/detalle.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const tipoUsuario = localStorage.getItem("tipo");
      const backLink = document.getElementById("detalleBackLink");
      if (!backLink) return;
      const params = new URLSearchParams(window.location.search);
      if (tipoUsuario === "ong") {
        params.delete("id");
        let queryString = params.toString();
        if (!queryString) {
          const storedPage = parseInt(sessionStorage.getItem("pawtasticMascotasPage"), 10);
          if (Number.isFinite(storedPage) && storedPage > 0) {
            queryString = `page=${storedPage}`;
          }
        }
        backLink.href = queryString ? `./mis-mascotas.html?${queryString}` : "./mis-mascotas.html";
        backLink.innerHTML = '<i class="bi bi-arrow-left"></i> Volver a mis mascotas';
      } else {
        const page = parseInt(params.get("page"), 10);
        const pageParam = Number.isFinite(page) && page > 0 ? `?page=${page}` : "";
        backLink.href = `./catalogo.html${pageParam}`;
        backLink.innerHTML = '<i class="bi bi-arrow-left"></i> Volver al catálogo';
      }
    });
  </script>
  <script src="../js/role-theme.js"></script>

</body>

</html>
