<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis Mascotas | Pawtastic</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" href="../img/favicon.ico" type="image/png">
</head>

<body>
  <!-- NAVBAR ONG -->
  <nav class="navbar navbar-expand-lg navbar-dark encabezado-azul">
    <div class="container position-relative">
      <a class="navbar-brand d-flex align-items-center" href="../index.html">
        <img src="../img/logo.png" alt="Logo Pawtastic" width="50" height="50" class="me-2 logo-navbar">
        <span class="text-warning fw-bold">Pawtastic</span>
      </a>
      <div class="position-absolute top-50 start-50 translate-middle">
        <span class="navbar-text h4 m-0 text-dark fw-bold">MIS MASCOTAS🐾</span>
      </div>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="perfil-ong.html">Perfil</a></li>
          <li class="nav-item">
            <a href="#" class="nav-link text-danger fw-bold" data-bs-toggle="modal" data-bs-target="#modalCerrarSesion">
              <i class="bi bi-box-arrow-right me-1"></i>Salir
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="text-warning fw-bold">Mis Mascotas Publicadas</h2>
      <a href="perfil-ong.html" class="btn btn-dark">
        <i class="bi bi-arrow-left-circle me-1"></i> Volver al perfil
      </a>
    </div>

    <div id="contenedorMascotas" class="row g-4 justify-content-center">
      <p class="text-center text-muted">Cargando mascotas...</p>
    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const token = localStorage.getItem("token");
      const contenedor = document.getElementById("contenedorMascotas");

      if (!token) {
        contenedor.innerHTML = "<p class='text-danger'>⚠️ Debes iniciar sesión.</p>";
        return;
      }

      try {
        const res = await fetch("../api/listar_mascotas.php", {
          headers: { "Authorization": "Bearer " + token }
        });
        const data = await res.json();

        if (data.mascotas && data.mascotas.length > 0) {
          contenedor.innerHTML = "";
          data.mascotas.forEach(m => {
            contenedor.innerHTML += `
              <div class="col-md-4">
                <div class="card shadow-sm h-100" style="max-width: 320px; margin: 0 auto;">
                  <div style="height: 200px; display: flex; align-items: center; justify-content: center; background-color: #f8f9fa;">
                    <img src="../img/mascotas/${m.imagen}" alt="${m.nombre}" class="rounded" 
                         style="max-height: 100%; max-width: 100%; object-fit: contain;">
                  </div>
                  <div class="card-body bg-light-subtle">
                    <h5 class="card-title">${m.nombre}</h5>
                    <p class="text-muted">${m.descripcion}</p>
                    <ul class="list-unstyled small">
                      <li><strong>Tipo:</strong> ${m.tipo}</li>
                      <li><strong>Edad:</strong> ${m.edad}</li>
                      <li><strong>Sexo:</strong> ${m.sexo}</li>
                      <li><strong>Tamaño:</strong> ${m.tamaño}</li>
                    </ul>
                    <div class="d-flex justify-content-between mt-3">
                      <button class="btn btn-outline-primary btn-sm"><i class="bi bi-pencil"></i> Editar</button>
                      <button class="btn btn-outline-danger btn-sm"><i class="bi bi-trash"></i> Eliminar</button>
                    </div>
                  </div>
                </div>
              </div>
            `;
          });
        } else {
          contenedor.innerHTML = "<p class='text-center text-muted'>No hay mascotas cargadas aún.</p>";
        }
      } catch (error) {
        console.error(error);
        contenedor.innerHTML = "<p class='text-danger'>Error al cargar mascotas.</p>";
      }
    });
  </script>


  <!-- MODAL SALIR -->
  <div class="modal fade" id="modalCerrarSesion" tabindex="-1" aria-labelledby="modalCerrarSesionLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-warning-subtle">
          <h5 class="modal-title" id="modalCerrarSesionLabel">¿Cerrar sesión?</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          ¿Estás segura de que querés salir del sitio?
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button id="confirmarSalir" class="btn btn-danger">Sí, salir</button>
        </div>
      </div>
    </div>
  </div>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById("confirmarSalir").addEventListener("click", function () {
      window.location.href = "../index.html";
    });
  </script>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const token = localStorage.getItem("token");
      if (!token) {
        alert("Debes iniciar sesión");
        window.location.href = "login.html";
        return;
      }

      try {
        const res = await fetch("../api/listar_mascotas.php", {
          headers: { "Authorization": "Bearer " + token }
        });
        const data = await res.json();

        const contenedor = document.querySelector(".row.g-4");
        contenedor.innerHTML = ""; // limpiar

        data.forEach(m => {
          const card = `
        <div class="col-md-4">
          <div class="card shadow-sm h-100" style="max-width: 320px; margin: 0 auto;">
            <img src="../${m.imagen}" class="card-img-top" alt="${m.nombre}">
            <div class="card-body bg-light-subtle">
              <h5 class="card-title">${m.nombre}</h5>
              <p class="text-muted">${m.descripcion}</p>
              <p><strong>Tipo:</strong> ${m.tipo}</p>
              <p><strong>Edad:</strong> ${m.edad}</p>
              <p><strong>Sexo:</strong> ${m.sexo}</p>
              <p><strong>Tamaño:</strong> ${m.tamaño}</p>
              <div class="d-flex justify-content-between">
                <button class="btn btn-outline-primary btn-sm">Editar</button>
                <button class="btn btn-outline-danger btn-sm">Eliminar</button>
              </div>
            </div>
          </div>
        </div>`;
          contenedor.innerHTML += card;
        });

      } catch (error) {
        console.error(error);
        alert("Error al cargar las mascotas");
      }
    });
  </script>

</body>

</html>
