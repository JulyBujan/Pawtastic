    <div class="container">

  <!-- CONTENIDO PRINCIPAL -->
  <main class="container py-5 flex-grow-1">
    <h2 class="mb-4 text-center">Editar Mascota</h2>
    <form id="formEditarMascota" class="mx-auto shadow p-4 bg-light rounded" style="max-width: 700px;">
      <input type="hidden" id="id_mascota">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="nombre" class="form-label">Nombre</label>
          <input type="text" class="form-control" id="nombre" required>
        </div>
        <div class="col-md-6 mb-3">
          <label for="tipo" class="form-label">Tipo</label>
          <select id="tipo" class="form-select" required>
            <option value="">Seleccionar</option>
            <option value="perro">Perro</option>
            <option value="gato">Gato</option>
            <option value="otro">Otro</option>
          </select>
        </div>
      </div>

      <div class="mb-3">
        <label for="descripcion" class="form-label">Descripción</label>
        <textarea class="form-control" id="descripcion" rows="3" required></textarea>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="edad" class="form-label">Edad</label>
          <input type="number" class="form-control" id="edad" placeholder="Ej: 2" required min="0">
        </div>
        <div class="col-md-6 mb-3">
          <label for="sexo" class="form-label">Sexo</label>
          <select id="sexo" class="form-select" required>
            <option value="">Seleccionar</option>
            <option value="Macho">Macho</option>
            <option value="Hembra">Hembra</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="tamaño" class="form-label">Tamaño</label>
          <select id="tamaño" class="form-select" required>
            <option value="">Seleccionar</option>
            <option value="Pequeño">Pequeño</option>
            <option value="Mediano">Mediano</option>
            <option value="Grande">Grande</option>
          </select>
        </div>
        <div class="col-md-6 mb-3">
          <label for="foto" class="form-label">Cambiar Foto</label>
          <input type="file" class="form-control" id="foto">
          <img id="foto_actual" class="img-fluid mt-2" style="max-height: 100px;"/>
        </div>
      </div>

      <hr class="my-4">

      <!-- SALUD -->
      <h5 class="text-warning"><i class="bi bi-heart-pulse"></i> Salud</h5>
      <div class="row">
        <div class="col-md-4 mb-3">
          <label for="vacunado" class="form-label">Vacunado</label>
          <select id="vacunado" class="form-select" required>
            <option value="si">Sí</option>
            <option value="no">No</option>
            <option value="">Elegir una opción</option>
          </select>
        </div>
        <div class="col-md-4 mb-3">
          <label for="esterilizado" class="form-label">Esterilizado</label>
          <select id="esterilizado" class="form-select" required>
            <option value="si">Sí</option>
            <option value="no">No</option>
            <option value="">Elegir una opción</option>
          </select>
        </div>
        <div class="col-md-4 mb-3">
          <label for="chip" class="form-label">Chip</label>
          <select id="chip" class="form-select" required>
            <option value="si">Sí</option>
            <option value="no">No</option>
            <option value="">Elegir una opción</option>
          </select>
        </div>
      </div>

      <hr class="my-4">

      <!-- PERSONALIDAD -->
      <h5 class="text-warning"><i class="bi bi-stars"></i> Personalidad</h5>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="energia" class="form-label">Nivel de energía</label>
          <select id="energia" name="energia" class="form-select" required>
            <option value="">Seleccionar</option>
            <option value="3">Alto</option>
            <option value="2">Medio</option>
            <option value="1">Bajo</option>
          </select>
        </div>
        <div class="col-md-6 mb-3">
          <label for="sociabilidad" class="form-label">Sociabilidad</label>
          <select id="sociabilidad" name="sociabilidad" class="form-select" required>
            <option value="">Seleccionar</option>
            <option value="3">Muy sociable</option>
            <option value="2">Selectivo</option>
            <option value="1">Reservado</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="presencia" class="form-label">Presencia</label>
          <select id="presencia" name="presencia" class="form-select" required>
            <option value="">Seleccionar</option>
            <option value="3">Necesita compañía constante</option>
            <option value="2">Tolera estar solo</option>
            <option value="1">Independiente</option>
          </select>
        </div>
        <div class="col-md-6 mb-3">
          <label for="estilov" class="form-label">Estilo de vida</label>
          <select id="estilov" name="estilov" class="form-select" required>
            <option value="">Seleccionar</option>
            <option value="1">Indoor</option>
            <option value="2">Outdoor</option>
            <option value="3">Flexible</option>
          </select>
        </div>
      </div>

      <div class="d-grid mt-4">
        <button type="submit" class="btn btn-primary">Guardar Cambios</button>
      </div>
    </form>
  </main>

  <!-- FOOTER -->
  <footer class="bg-footer text-dark pt-4 pb-3 mt-5">
    <div class="container text-center text-md-start">
      <div class="row">
        <div class="col-md-4 mb-3 text-center">

          <h5 class="fw-bold text-center">Navegación</h5>

          </ul>
        </div>
